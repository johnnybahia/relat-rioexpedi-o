name: Testes (simulação do Apps Script)

# Roda a bateria de simulação (testes/rodar_todos.js) em todo push e pull request.
# Cobre inclusive arquivos enviados pelo site do GitHub. Ver CLAUDE.md, seção 18.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Chromium para o teste da tela
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Bateria de simulação
        run: node testes/rodar_todos.js
